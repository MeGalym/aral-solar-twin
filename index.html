<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Платформа ВИЭ — СЭС Арал 30 МВт</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --glass: rgba(18,24,38,.66); --glass-strong: rgba(14,19,31,.92);
  --tile: rgba(255,255,255,.055); --tile-hover: rgba(255,255,255,.1);
  --line: rgba(255,255,255,.09); --text: #f2f4f8; --muted: #a0a9bb; --faint: #717a8d;
  --amber: #f5b544; --ok: #62d6a0; --warn: #f5b544; --bad: #ff6452;
  --r-lg: 20px; --r-md: 13px; --r-sm: 9px; --gap: 12px; --rw: clamp(252px, 27vw, 348px);
  --display: "Geologica","Golos Text",system-ui,sans-serif; --body: "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0a0e16;color:var(--text);font:13px/1.4 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h2,h3,p,dl{margin:0}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 18px 44px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* каркас: сцена на весь экран, поверх — верхняя строка, меню слоёв слева, колонка справа, нижняя строка */
#ui{position:fixed;inset:0;pointer-events:none;display:grid;gap:var(--gap);padding:16px;
  grid-template-columns:minmax(0,1fr) var(--rw);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "left right" "bot right"}
#top{grid-area:top;display:flex;gap:10px;align-items:center;min-width:0}
#top>*{pointer-events:auto}
#left{grid-area:left;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:0;min-width:0}
#left>*{pointer-events:auto}
#right{grid-area:right;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;scrollbar-width:none;border-radius:var(--r-lg);pointer-events:auto}
#right::-webkit-scrollbar{display:none}
#bot{grid-area:bot;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:var(--gap);min-width:0}
#bot>*{pointer-events:auto;min-width:0}

/* верхняя строка */
.brand{display:flex;align-items:center;gap:10px;padding:0 16px 0 7px;border-radius:999px;height:46px;flex:none}
.brand-mark{width:32px;height:32px;border-radius:50%;background:var(--amber);display:grid;place-items:center;flex:none}
.brand b{font:600 16px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap}
.tabs{display:flex;padding:4px;border-radius:999px;gap:2px;height:46px;flex:none}
.tabs button{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs a{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;text-decoration:none}
.tabs button:hover,.tabs a:hover{color:var(--text)}
.tabs a.on{background:var(--amber);color:#1b1407}
.tabs button[aria-pressed="true"]{background:var(--amber);color:#1b1407}
.tabs svg{flex:none}
.search{position:relative;flex:1 1 130px;max-width:300px;min-width:0}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:0 14px 0 40px;min-width:0}
.search input::placeholder{color:var(--faint)}
.search>svg{position:absolute;left:15px;top:15px;opacity:.6;pointer-events:none}
#suggest{position:absolute;top:52px;left:0;min-width:240px;right:0;padding:6px;display:none;border-radius:var(--r-md);background:var(--glass-strong);z-index:6}
#suggest.open{display:block}
#suggest button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm)}
#suggest button:hover,#suggest button.act{background:var(--tile-hover)}
#suggest small{color:var(--muted)}
.clock{display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;border-radius:999px;height:46px;white-space:nowrap;margin-left:auto;flex:none}
.clock .num{font-size:16px;font-weight:500;padding-right:8px}
.clock select{background:var(--tile);border:1px solid var(--line);border-radius:999px;padding:6px 12px;appearance:none;-webkit-appearance:none;cursor:pointer;margin-left:-6px}
.clock select option{background:#161c2a}

/* меню слоёв и карточка выбранного объекта */
.menu{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:18px}
.menu:empty{display:none}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 11px;border-radius:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.menu button::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
.menu button:hover{color:var(--text)}
.menu button[aria-pressed="true"]{background:rgba(255,255,255,.13);color:var(--text)}
.menu button[aria-pressed="true"]::before{background:var(--amber);opacity:1}
#insp{width:min(292px,100%);max-height:100%;overflow:auto;scrollbar-width:none;flex:0 1 auto}
#legend{width:min(250px,100%);padding:12px 14px}
#legend h2{font-size:13px}

.card{padding:14px}
.card h2{font:500 15px/1.2 var(--display);letter-spacing:-.01em}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;min-height:24px}
.card-head h2{min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--tile);color:var(--muted);white-space:nowrap;flex:none}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.warn i{background:var(--warn)}.pill.bad i{background:var(--bad)}.pill.off i{display:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{background:var(--tile);border-radius:var(--r-md);padding:10px 11px;min-width:0;display:flex;flex-direction:column}
.tile label{color:var(--muted);font-size:11.5px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font:500 clamp(18px,1.75vw,23px)/1.05 var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font:400 11.5px var(--body);color:var(--muted);margin-left:3px;letter-spacing:0}
.tile .s{color:var(--faint);font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .viz{margin-top:auto;padding-top:8px}
.tile svg{display:block;width:100%;height:auto;overflow:visible}
.tile .gauge{max-width:132px;margin:2px auto 0}
.gt{font:500 15px var(--display);fill:#fff;letter-spacing:-.02em}
.gs{font:400 9.5px var(--body);fill:var(--muted)}
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px 8px;align-items:baseline;width:100%;background:var(--tile);border-radius:var(--r-md);padding:9px 11px}
button.row:hover,.ev:hover{background:var(--tile-hover)}
.row .n{font-weight:600;white-space:nowrap}
.row .t{color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .p{font:500 13.5px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .p small{font:400 11px var(--body);color:var(--muted)}
.row .note{grid-column:1/-1;font-size:11px;color:var(--muted)}.row .note.bad{color:var(--bad)}.row .note.ok{color:var(--ok)}
.row.w{grid-template-columns:minmax(0,1fr) auto}.row.w .n{white-space:normal;font-weight:500}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);position:relative}
.bar i{display:block;height:100%;background:var(--amber);border-radius:2px;width:0}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;border-radius:1px}
.ev{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:2px 9px;width:100%;background:var(--tile);border-radius:var(--r-md);padding:9px 11px;cursor:pointer}
.ev .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--warn)}
.ev.bad .dot{background:var(--bad)}.ev.ok .dot{background:var(--ok)}
.ev b{font-weight:600;min-width:0}
.ev span{grid-column:2/-1;color:var(--muted);font-size:11.5px}
.ev em{font-style:normal;font:500 12px var(--display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wo{grid-column:2/-1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:6px}
.wo .segs{flex:1 0 100%;order:3;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.wo .segs i{height:5px;border-radius:3px;background:rgba(255,255,255,.1)}.wo .segs i.on{background:var(--amber)}
.wo small{color:var(--muted);font-size:11px;flex:1;min-width:0}
.mini{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);font-size:11.5px;white-space:nowrap}
.mini:hover{background:rgba(255,255,255,.18)}.mini.go{background:var(--amber);color:#1b1407;font-weight:600}
.empty{color:var(--muted);font-size:12.5px;line-height:1.5}
.foot{color:var(--faint);font-size:11px;line-height:1.45;padding:2px 6px 6px}

.seg{display:flex;background:var(--tile);border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{flex:1 1 auto;padding:5px 4px;border-radius:999px;font-size:11.5px;color:var(--muted);text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.15);color:var(--text)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.crumbs button{padding:3px 8px;border-radius:999px;background:var(--tile);font-size:11.5px;color:var(--muted);white-space:nowrap}
.crumbs button.cur{background:rgba(255,255,255,.16);color:var(--text)}
.x{width:26px;height:26px;border-radius:50%;background:var(--tile);display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--tile-hover);color:var(--text)}
.insp-title{font:500 20px/1.15 var(--display);letter-spacing:-.02em;margin-bottom:2px}
.insp-sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-bottom:10px}
.big b{font:500 27px/1 var(--display);letter-spacing:-.03em;white-space:nowrap}
.big span{font-size:12px;color:var(--muted);white-space:nowrap}.big span.bad{color:var(--bad)}.big span.warn{color:var(--warn)}.big span.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv dd.bad{color:var(--bad)}
.kv.sep{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.insp-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 13px;border-radius:999px;background:var(--tile);font-size:12px;white-space:nowrap}
.btn:hover{background:var(--tile-hover)}.btn.go{background:var(--amber);color:#1b1407;font-weight:600;flex:1 1 100%;text-align:center}
.steps{display:flex;flex-direction:column;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:1px 8px;align-items:center;font-size:12.5px}
.step i{width:10px;height:10px;border-radius:50%;border:2px solid var(--faint)}
.step.done i{background:var(--ok);border-color:var(--ok)}.step.now i{background:var(--amber);border-color:var(--amber)}
.step small{grid-column:2/-1;color:var(--muted);font-size:11px}.step small.bad{color:var(--bad)}
.step em{font-style:normal;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ramp{height:7px;border-radius:4px;margin:9px 0 5px}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.keys{display:flex;flex-direction:column;gap:5px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.keys i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.ring{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.ring .c{position:relative}
.ring .c b{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);text-align:center;font:500 17px/1 var(--display);letter-spacing:-.02em}
.ring .c small{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:9.5px;color:var(--faint)}
.ring ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:11.5px;min-width:0}
.ring li{display:flex;justify-content:space-between;gap:6px;color:var(--muted);min-width:0}
.ring li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ring li i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ring li b{font:500 12px var(--display);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* нижняя строка */
#time{padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(64px,1fr) auto;gap:6px 12px;align-items:stretch}
#time .ctl{display:flex;flex-direction:column;gap:5px;justify-content:center}
.play{width:40px;height:40px;border-radius:50%;background:var(--amber);color:#1b1407;display:grid;place-items:center}
.now{font-size:11px;color:var(--muted);text-align:center}.now:hover{color:var(--text)}
.chart{position:relative;min-height:64px}
.chart svg{position:absolute;left:0;right:0;top:16px;bottom:0;width:100%;height:calc(100% - 16px);overflow:visible}
.chart input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.axis{grid-column:2;position:relative;height:14px;color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums;overflow:hidden}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.cap{position:absolute;left:0;top:-1px;right:0;color:var(--faint);font-size:11px;display:flex;gap:14px;pointer-events:none;white-space:nowrap;overflow:hidden}
.cap i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle;background:#fff}
#bars{grid-column:1/-1;grid-row:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;min-height:120px;padding-top:36px;position:relative}
#bars .cap{white-space:normal;line-height:1.35;display:block}
#bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10.5px;color:var(--faint)}
#bars i{display:block;width:60%;max-width:24px;border-radius:6px;background:linear-gradient(#fff,#b9c0cf)}
#bars .hi i{background:linear-gradient(#ffd98a,#f5b544)}
#bars b{font:500 10.5px var(--display);color:var(--muted)}

.fin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fin label{display:flex;flex-direction:column;justify-content:space-between;gap:4px;font-size:11px;line-height:1.3;color:var(--muted);background:var(--tile);border-radius:var(--r-md);padding:8px 10px}
.fin input{background:none;border:0;padding:0;font:500 15px var(--display);width:100%;outline-offset:4px;-moz-appearance:textfield}
.fin input::-webkit-outer-spin-button,.fin input::-webkit-inner-spin-button{-webkit-appearance:none}
.wf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:12.5px}
.wf dt{color:var(--muted)}.wf dd{margin:0;text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums}
.wf .sum{color:var(--text);font-weight:600;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
table.boq{width:100%;border-collapse:collapse;font-size:12px}
.boq td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:baseline}
.boq td:nth-child(2){text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.boq small{color:var(--faint);display:block;font-size:10.5px}

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(14,19,31,.82);border:1px solid var(--line);font-size:11.5px;white-space:nowrap;will-change:transform;pointer-events:auto;cursor:pointer}
.lbl i{width:7px;height:7px;background:#fff;transform:rotate(45deg);border-radius:1.5px;box-shadow:0 0 0 3px rgba(255,255,255,.14);flex:none}
.lbl b{font-weight:600}.lbl span{color:var(--muted);font-family:var(--display);font-variant-numeric:tabular-nums}
.lbl span:empty{display:none}
.lbl.alert{background:var(--amber);color:#1b1407;border-color:transparent}.lbl.alert i{background:#1b1407;box-shadow:none}.lbl.alert span{color:#553c08}
.lbl.sel{outline:2px solid #fff;outline-offset:2px}
#tip{position:fixed;left:0;top:0;pointer-events:none;padding:6px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--line);font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:9}
#tip b{font-family:var(--display);font-weight:500}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#0a0e16;color:var(--muted);z-index:20;transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}

/* карта, разделы внутри стадии, ползунки, графики и таблицы новых экранов */
#map{position:fixed;inset:0;display:none;background:#0a0e16;z-index:0}
body.map #map{display:block}body.map #scene,body.map #labels{visibility:hidden}
#map .leaflet-tooltip{background:rgba(14,19,31,.88);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:3px 9px;font:500 11.5px var(--body);box-shadow:none}
#map .leaflet-tooltip::before{display:none}
#map.draw{cursor:crosshair}
.views{display:flex;flex-wrap:wrap;gap:2px;padding:5px;border-radius:18px;flex:none}
.views button{flex:1 1 auto;padding:7px 11px;border-radius:12px;color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap;text-align:center}
.views button:hover{color:var(--text)}
.views button[aria-pressed="true"]{background:var(--amber);color:#1b1407}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;background:var(--tile);border-radius:var(--r-md);padding:9px 11px;font-size:12px;color:var(--muted)}
.sl output{font:500 14px var(--display);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.sl input{grid-column:1/-1;width:100%;margin:4px 0 0;accent-color:var(--amber);height:18px}
.sl small{grid-column:1/-1;font-size:11px;color:var(--faint)}
.demo{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(127,182,255,.14);color:#a9cbff;white-space:nowrap;vertical-align:middle}
.note-line{font-size:12px;color:var(--muted);line-height:1.45;margin-top:9px}.note-line.ok{color:var(--ok)}.note-line.bad{color:var(--bad)}.note-line.warn{color:var(--warn)}
.row.sel,.ev.sel{outline:1.5px solid var(--amber);outline-offset:-1.5px}
.row .tag{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--amber);color:#1b1407;font-weight:600;margin-left:6px}
#plot{grid-column:1/-1;grid-row:1/-1;display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0}

  const crumbs = crumb('ktp','КТП-'+c.ktp)+crumb('inv',c.inv!=null?invName(c.inv):null)+crumb('tracker',c.tracker!=null?tName(c.tracker):null)+crumb('string',c.string!=null?'стринг '+(c.string%3+1):null)+crumb('panel',c.panel!=null?'панель '+(c.panel+1):null);
  let title, sub, rows = [];
  if(s.level==='panel'){title=`Панель ${s.i+1}`; sub=`${tName(s.t)}, модуль ${M.moduleW} Вт, 2384×1303 мм`; rows.push(['Температура модуля', fmt(pTemp[s.t*NP+s.i])+' °C'], ['Загрязнение', fmt(st.soil*100,1)+' %']);}
  else if(s.level==='string'){title=`Стринг ${s.sid%3+1}`; sub=`${tName(s.sid/3|0)}, 27 панелей последовательно`; const v = live.day&&st.kw>0 ? 27*live.at(tAng[s.sid/3|0]).v : 0; rows.push(['Напряжение', v?fmt(v)+' В':'—'], ['Ток', v?fmt(st.kw*1000/v,1)+' А':'—'], ['Подключён к', invName(strInv[s.sid])]);}
  else if(s.level==='tracker'){title=tName(s.t); sub=`Одноосный трекер 1×81, ${fmt(NP*M.moduleW/1000,2)} кВт пик`;
    rows.push(['Угол стола', `${fmt(Math.abs(tAng[s.t]*DEG))}° на ${tAng[s.t]>=0?'восток':'запад'}`], ['Расчётный угол', `${fmt(Math.abs(live.aT*DEG))}° на ${live.aT>=0?'восток':'запад'}`], ['Инверторы', [...new Set([0,1,2].map(k=>invName(strInv[s.t*3+k])))].join(', ')], ['Самая горячая панель', fmt(st.tmax)+' °C']);}
  else if(s.level==='inv'){const v=SITE.inverters[s.ii]; title=invName(s.ii); sub=`${M.inverterType}, ${M.inverterKw} кВт, ${v.strings} стрингов`;
    rows.push(['Вход DC', pw(invDC[s.ii]/1000)], ['Выход AC', pw(invAC[s.ii])], ['Загрузка', fmt(invAC[s.ii]/M.inverterKw*100)+' %'], ['Срез по мощности', invF[s.ii]<1&&invState[s.ii]!==1?fmt((1-invF[s.ii])*100)+' %':'нет']);}
  else {const k=SITE.ktp[s.k-1]; title=k.name; sub=`${k.type}, ${fmt(k.kva)} кВА, 0,8/35 кВ`;
    rows.push(['Загрузка трансформатора', fmt(ktpAC[s.k]/k.kva*100)+' %'], ['Инверторов', SITE.inverters.filter(v=>v.k===s.k).length], ['Панелей', fmt(st.n)], ['Фидер 35 кВ', s.k<=2?'№1, через КТП-1':'№2, через КТП-3']);}
  const key = selKey(s), ev = evCache.find(x=>x.key===key), order = S.orders.find(o=>o.key===key);
  el.innerHTML = `<div class="card-head"><span class="pill ${cls==='ok'?'':cls}"><i></i><span>${stText}</span></span><button class="x" data-act="clear" aria-label="Закрыть"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 1l8 8M9 1 1 9"/></svg></button></div>${seg}<div class="crumbs">${crumbs}</div>
    <h3 class="insp-title">${title}</h3><div class="insp-sub">${sub}</div>
    <div class="big"><b>${pw(s.level==='ktp'?ktpAC[s.k]:st.kw)}</b>${Number.isNaN(dev)?'':`<span class="${dev<-15?'bad':dev<-6?'warn':'ok'}">${dev<-0.5?'↓ '+fmt(-dev,1)+' % к ожидаемому':'в норме'}</span>`}</div>
    <dl class="kv">${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>
    <div class="insp-actions">${ev&&ev.fix?(order?`<button class="btn go" data-adv="${key}">Наряд ${order.n}: ${WO_STEPS[order.step].toLowerCase()} ✓</button>`:`<button class="btn go" data-new="${key}">Создать наряд бригаде</button>`):''}<button class="btn" data-act="fly">Показать в сцене</button></div>`;
}
$('#insp').addEventListener('click', e=>{
  const go=e.target.closest('[data-go]'), act=e.target.closest('[data-act]'), lv=e.target.closest('[data-level]'), nw=e.target.closest('[data-new]'), adv=e.target.closest('[data-adv]');
  if(nw) return createOrder(nw.dataset.new); if(adv) return advanceOrder(adv.dataset.adv);
  if(go){S.level=go.dataset.go; return select(atLevel(go.dataset.go, chain(S.sel)));}
  if(lv){const prev=S.sel; S.level=lv.dataset.level; if(prev){const c=chain(prev); if(S.level==='ktp'||c.tracker!=null||(S.level==='inv'&&c.inv!=null)) return select(atLevel(S.level,c));} return renderInspector();}
  if(act) act.dataset.act==='fly' ? flyToSel() : select(null);
});
function selCenter(s){
  if(s.level==='ktp'){const k=SITE.ktp[s.k-1]; return {p:new THREE.Vector3(k.x,0,k.z), r:s.k%2?330:230};}
  if(s.level==='inv'){const v=SITE.inverters[s.ii]; return {p:new THREE.Vector3(v.x,0,v.z), r:150};}
  const t = s.level==='string'? s.sid/3|0 : s.t;
  if(s.level==='tracker') return {p:new THREE.Vector3(tX[t],HUB,tZ[t]), r:95};
  if(s.level==='string') return {p:new THREE.Vector3(tX[t],HUB,tZ[t]+((s.sid%3)-1)*LEN/3), r:46};
  return {p:new THREE.Vector3(tX[t],HUB,tZ[t]-LEN/2+(s.i+.5)*LEN/NP), r:14};
}
function markSel(){ const s=S.sel; selLine.visible = !!s&&S.stage==='build'; if(selLine.visible) selLine.position.set(tX[s.t],0,tZ[s.t]);
  Object.entries(labels).forEach(([id,l])=>l.el.classList.toggle('sel', !!s&&((s.level==='ktp'&&String(s.k)===id)||l.key===(s&&selKey(s))))); }
function select(s, fly){ S.sel = s; if(s&&S.stage==='ops') S.level = s.level; paint(); renderInspector(); renderLegend(); markSel(); if(s&&fly) flyToSel(); }
let tween = null;
function flyView(pos, tgt, ms=1500){ const p=new THREE.Vector3(...pos), a=new THREE.Vector3(...tgt); if(reduceMotion){camera.position.copy(p); controls.target.copy(a); return;} tween = {t0:performance.now(), ms, p0:camera.position.clone(), p1:p, a0:controls.target.clone(), a1:a}; }
function flyToSel(){ if(!S.sel) return; const {p,r} = selCenter(S.sel), dir = camera.position.clone().sub(controls.target).normalize(); if(dir.y<.38){dir.y=.38; dir.normalize();}
  const to = p.clone().add(dir.multiplyScalar(r*2.4)); flyView([to.x,to.y,to.z],[p.x,p.y,p.z],1100); }

/* ═════════ подписи в сцене ═════════ */
const labels = {}, labelsEl = $('#labels'), v3 = new THREE.Vector3();
function addLabel(id, pos, html, cls, onclick, key){ const d=document.createElement('div'); d.className='lbl '+(cls||''); d.innerHTML=html; d.onclick=onclick; labelsEl.appendChild(d); labels[id]={el:d, p:pos, key, on:true}; }
SITE.ktp.forEach(k=>addLabel(k.id, new THREE.Vector3(k.x,7,k.z), `<i></i><b>${k.name}</b><span></span>`, '', ()=>select({level:'ktp',k:k.id},true)));
function alertLabels(){
  Object.keys(labels).filter(k=>k[0]==='a').forEach(k=>{labels[k].el.remove(); delete labels[k];});
  if(S.stage==='ops'&&S.view.ops==='sens') UI.sensorLabels().forEach((l,i)=>addLabel('as'+i, new THREE.Vector3(l.x,l.h+2.5,l.z), `<i></i><b>${l.id}</b><span>${l.text}</span>`, l.lost?'alert':'', ()=>UI.pickSensor(l.id), 'sens:'+l.id));
  if(S.stage==='ops'){ if(S.view.ops!=='sens') evCache.filter(e=>e.sel&&e.sel.level!=='string').slice(0,PHONE?2:5).forEach((e,i)=>{const {p}=selCenter(e.sel); p.y=5;
      addLabel('a'+i, p, `<i></i><b>${e.sel.level==='inv'?invName(e.sel.ii):tName(e.sel.t)}</b><span>${live.day?'−'+fmt(e.loss)+' кВт':''}</span>`, 'alert', ()=>select(e.sel,true), e.key);});
    SITE.ktp.forEach(k=>labels[k.id].el.querySelector('span').textContent = fmt(ktpAC[k.id]/1000,2)+' МВт'); }
  if(S.stage==='build') bm.missing.slice(0,4).forEach((t,i)=>addLabel('a'+i, new THREE.Vector3(tX[t],5,tZ[t]), `<i></i><b>${tName(t)}</b><span>−${81-EPC.missed[t]} мод.</span>`, 'alert', ()=>select({level:'tracker',t},true), 'tracker:'+t));
  if(S.stage==='build'&&S.bmode==='qc') bm.open.slice(-8).forEach((q,i)=>addLabel('aq'+i, new THREE.Vector3(tX[q.t],4,tZ[q.t]), `<i></i><b>${tName(q.t)}</b>`, 'alert', ()=>select({level:'tracker',t:q.t},true), 'tracker:'+q.t));
  if(S.stage==='cost'||S.stage==='dev') SITE.ktp.forEach(k=>labels[k.id].el.querySelector('span').textContent = fmt(k.kva/1000,1)+' МВА');
}
const INS = {l:0,r:0,t:0,b:0,block:[]};
function insets(){ const w = canvas.clientWidth, h = canvas.clientHeight;
  if(innerWidth<=760){INS.l=-30; INS.r=-30; INS.t=$('#top').getBoundingClientRect().bottom-10; INS.b=$('#modes').offsetHeight?58:8; INS.block=[]; const cy=(INS.t+h-INS.b)/2; camera.setViewOffset(w,h,0,Math.round(h/2-cy),w,h); return;}
  INS.r = w-$('#right').getBoundingClientRect().left+4; INS.b = h-$('#bot').getBoundingClientRect().top+4; INS.t = $('#top').getBoundingClientRect().bottom+4; INS.l = 8;
  INS.block = ['#modes','#legend','#insp'].map(q=>$(q).getBoundingClientRect()).filter(r=>r.width>0);
  const cx = (INS.l+w-INS.r)/2, cy = (INS.t+h-INS.b)/2; camera.setViewOffset(w,h,Math.round(w/2-cx),Math.round(h/2-cy),w,h); }
function placeLabels(){ const w = canvas.clientWidth, h = canvas.clientHeight;
  for(const l of Object.values(labels)){v3.copy(l.p).project(camera); const x=(v3.x*.5+.5)*w, y=(-v3.y*.5+.5)*h, vis = v3.z<1&&x>INS.l+40&&x<w-INS.r-40&&y>INS.t+34&&y<h-INS.b-6&&!(INS.block||[]).some(r=>x>r.left-70&&x<r.right+70&&y>r.top-4&&y<r.bottom+34); l.el.style.display = vis?'':'none';
    if(vis) l.el.style.transform = `translate(${((v3.x*.5+.5)*w).toFixed(1)}px,${((-v3.y*.5+.5)*h).toFixed(1)}px) translate(-50%,-150%)`;} }

function renderLegend(){
  const css = st => `linear-gradient(90deg,${st.map(c=>`rgb(${c.join(',')})`).join(',')})`, el = $('#legend'), key = (a) => `<div class="keys">${a.map(x=>`<span><i style="background:#${x[0].toString(16).padStart(6,'0')}"></i>${x[1]}</span>`).join('')}</div>`;
  let h = '';
  if(S.stage==='ops'){ const L = {power:['Мощность каждой панели',RAMPS.power,['0','355','710 Вт']], temp:['Температура модулей',RAMPS.temp,['−10','30','75 °C']], loss:['Отклонение от ожидаемой мощности',RAMPS.loss,['норма','−15 %','нет выдачи']]}[S.mode];
    if(L) h = `<h2>${L[0]}</h2><div class="ramp" style="background:${css(L[1])}"></div><div class="ticks">${L[2].map(t=>`<span>${t}</span>`).join('')}</div>`;
    else if(S.mode==='elec') h = `<h2>Какой инвертор питает панель</h2><p class="empty" style="margin-top:8px">Цвет — инвертор, оттенок — подстанция. Жёлтые линии — кабели 0,8 кВ, голубые — фидеры 35 кВ к ЗРУ.</p>`; }
  if(S.stage==='build') h = S.bmode==='stat' ? `<h2>Что уже сделано на столе</h2>`+key(STAGE_COL.map((c,i)=>[c,STAGE_NAME[i]]).slice(1)) : S.bmode==='pf' ? `<h2>Отставание от плана</h2>`+key([[0x62d6a0,'в срок'],[0xf5b544,'до недели'],[0xf0784a,'до трёх недель'],[0xe5352f,'больше или пропуски']]) : `<h2>Открытые замечания ОТК</h2>`+key([[0xf5b544,'есть замечание'],[0xe5352f,'критичное']]);
  if(S.stage==='dev') h = UI.legend(S.view.dev);
  const isHint = !h&&!S.sel&&S.stage!=='cost'&&S.stage!=='dev';
  if(isHint) h = `<p class="empty" style="font-size:12px">${S.stage==='ops'?'Нажмите на стол в сцене, чтобы открыть его данные. Слои слева красят каждую панель.':'Нажмите на стол, чтобы увидеть его шаги с плановыми и фактическими датами.'}</p>`;
  el.classList.toggle('hint', isHint); el.innerHTML = h; el.style.display = h?'':'none';
}

/* ═════════ время, поиск, указатель ═════════ */
$('#t').addEventListener('input', e=>{ if(S.stage==='ops') S.min=+e.target.value; else S.day=+e.target.value; refresh(); });
$('#play').addEventListener('click', ()=>{S.playing=!S.playing; $('#play-ic').setAttribute('d', S.playing?'M4 2.5h3v11H4zM9 2.5h3v11H9z':'M4 2.5v11l9-5.5z');
  if(S.playing&&S.stage==='ops'&&S.min>=sunset+40){S.min=Math.max(0,sunrise-40);} if(S.playing&&S.stage==='build'&&S.day>=EPC.factEnd){S.day=0;} });
$('#now').addEventListener('click', ()=>{ if(S.stage==='ops'){const d=new Date(); S.doy=todayDoy; DOY=S.doy; $('#season').value='today'; buildCurve(); S.min=Math.round((d.getHours()*60+d.getMinutes())/5)*5;} else S.day=EPC.factEnd; $('#t').value=S.stage==='ops'?S.min:S.day; refresh(); });
const q = $('#q'), sug = $('#suggest'); let sugList = [];
function suggest(text){
  const s = text.trim().toLowerCase(), out=[]; if(!s) return out; const num = (s.match(/[\d.]+/)||[''])[0];
  SITE.ktp.forEach(k=>{ if(/кт|kt/.test(s)&&(!num||num===String(k.id))) out.push({label:k.name, hint:k.type, sel:{level:'ktp',k:k.id}}); });
  if((num||/inv|инв/.test(s))&&!/^t|^т|кт|kt/.test(s)) SITE.inverters.forEach((v,ii)=>{ if(out.length<7&&(!num||v.id.startsWith(num))) out.push({label:'Inv-'+v.id, hint:'инвертор, КТП-'+v.k, sel:{level:'inv',ii}}); });
  if(num&&/^\d+$/.test(num)&&!/inv|инв|кт|kt/.test(s)){const t=+num-1; if(t>=0&&t<NT) out.unshift({label:tName(t), hint:'трекер, КТП-'+tZone[t], sel:{level:'tracker',t}});}
  return out.slice(0,7);
}
const goSug = s => { if(S.stage==='cost'||S.stage==='dev') setStage('ops',false); if(S.stage==='build'&&s.sel.level!=='tracker') setStage('ops',false); select(s.sel,true); sug.classList.remove('open'); };
q.addEventListener('input', ()=>{sugList = suggest(q.value); sug.innerHTML = sugList.map((s,i)=>`<button data-i="${i}" class="${i?'':'act'}"><span>${s.label}</span><small>${s.hint}</small></button>`).join('') || (q.value.trim()?'<div style="padding:8px 10px;color:var(--muted)">Не нашёл. Попробуйте «Inv-1.17», «КТП 2» или номер трекера.</div>':''); sug.classList.toggle('open', !!q.value.trim());});
q.addEventListener('keydown', e=>{ if(e.key==='Enter'&&sugList[0]){goSug(sugList[0]); q.blur();} if(e.key==='Escape'){q.value=''; sug.classList.remove('open');} });
sug.addEventListener('click', e=>{const b=e.target.closest('[data-i]'); if(b) goSug(sugList[+b.dataset.i]);});
q.addEventListener('blur', ()=>setTimeout(()=>sug.classList.remove('open'),150));

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), im = new THREE.Matrix4(), lp = new THREE.Vector3();
function hitAt(cx, cy){
  const r = canvas.getBoundingClientRect(); ndc.set((cx-r.left)/r.width*2-1, -(cy-r.top)/r.height*2+1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(S.stage==='build'?[tables, foot]:[tables, invPick, ...ktpMeshes], false); if(!hits.length) return null; const h = hits[0];
  if(h.object===foot) return {type:'foot', t:h.instanceId};
  if(h.object===tables){tables.getMatrixAt(h.instanceId, im); lp.copy(h.point).applyMatrix4(im.invert()); const f=tFrac[h.instanceId]; return {type:'panel', t:h.instanceId, i:Math.max(0,Math.min(Math.round(f*NP)-1,Math.floor((lp.z/LEN+.5)*NP*f)))};}
  return h.object===invPick ? {type:'inv', ii:h.instanceId} : {type:'ktp', k:h.object.userData.ktp};
}
let down = null, hoverQueued = null; const tip = $('#tip');
canvas.addEventListener('pointerdown', e=>{down={x:e.clientX,y:e.clientY}; tween=null;});
canvas.addEventListener('pointerup', e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>5) return; down=null; if(S.stage==='cost'||S.stage==='dev') return;
  const h = hitAt(e.clientX,e.clientY); if(!h) return select(null);
  if(S.stage==='build') return select({level:'tracker',t:h.t});
  if(h.type==='inv') return select({level:'inv',ii:h.ii}); if(h.type==='ktp') return select({level:'ktp',k:h.k});
  select(atLevel(S.level, {tracker:h.t, panel:h.i, string:h.t*3+(h.i/27|0), inv:strInv[h.t*3+(h.i/27|0)], ktp:tZone[h.t]}));
});
canvas.addEventListener('pointermove', e=>{ if(e.pointerType!=='touch') hoverQueued = e; });
canvas.addEventListener('pointerleave', ()=>{hoverQueued=null; tip.style.opacity=0; U.uHover.value.set(-1,-1);});
function doHover(){
  const e = hoverQueued; hoverQueued = null; if(!e||e.buttons||S.stage==='cost'||S.stage==='dev'){tip.style.opacity=0; return;}
  const h = hitAt(e.clientX,e.clientY); U.uHover.value.set(-1,-1);
  if(!h){tip.style.opacity=0; canvas.style.cursor=''; return;} canvas.style.cursor='pointer';
  if(S.stage==='build'){const st=EPC.trackerState(h.t,S.day); tip.innerHTML = `${tName(h.t)} <b>${STAGE_NAME[st.stage].toLowerCase()}, модулей ${st.mods} из ${NP}</b>`;}
  else if(h.type==='panel'){U.uHover.value.set(h.i,h.t); const p=h.t*NP+h.i; tip.innerHTML = `${tName(h.t)}, панель ${h.i+1} <b>${live.day?fmt(pEff[p])+' Вт, '+fmt(pTemp[p])+' °C':'ночь'}</b>`;}
  else tip.innerHTML = h.type==='inv' ? `${invName(h.ii)} <b>${fmt(invAC[h.ii],1)} кВт</b>` : `КТП-${h.k} <b>${fmt(ktpAC[h.k]/1000,2)} МВт</b>`;
  tip.style.opacity=1; tip.style.transform = `translate(${e.clientX+14}px,${e.clientY+16}px)`;
}
addEventListener('keydown', e=>{ if(e.key==='Escape'&&document.activeElement!==q) select(null); });

/* ═════════ цикл ═════════ */
function resize(){const w=canvas.clientWidth, h=canvas.clientHeight, pr=renderer.getPixelRatio(); if(canvas.width!==Math.floor(w*pr)||canvas.height!==Math.floor(h*pr)){renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w/h<1.15?50:36; camera.updateProjectionMatrix(); insets();}}
const ease = t => t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let last = performance.now(), acc = 0, flow = 0;
function frame(now){
  const dt = Math.min(.1,(now-last)/1000); last = now; resize();
  if(S.playing){ acc += dt;
    if(S.stage==='ops'&&acc>=.14){const step=Math.floor(acc/.14)*5; acc%=.14; S.min+=step; if(S.min>1435) S.min=0; $('#t').value=S.min; refresh();}
    if(S.stage==='build'&&acc>=.09){acc=0; S.day++; if(S.day>EPC.factEnd+6){S.day=EPC.factEnd+6; S.playing=false; $('#play-ic').setAttribute('d','M4 2.5v11l9-5.5z');} $('#t').value=S.day; refresh();} }
  if(tween&&now>=tween.t0){const k=Math.min(1,(now-tween.t0)/tween.ms), e=ease(k); camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.a0,tween.a1,e); if(k>=1) tween=null;}
  controls.update(); if(hoverQueued) doHover();
  if(envDirty&&now-envTimer>140){envDirty=false; envTimer=now; refreshEnv();}
  if(elec.visible){flow += dt; feeders.forEach(f=>{const mw=(ktpAC[f.ids[0]]+ktpAC[f.ids[1]])/1000, n=f.dots.count; f.dots.visible = mw>.05; dm.rotation.set(0,0,0); dm.scale.set(1,1,1);
    for(let i=0;i<n;i++){f.path.getPointAt(((i/n)+flow*(.012+mw*.004))%1, v3); dm.position.copy(v3); dm.updateMatrix(); f.dots.setMatrixAt(i,dm.matrix);} f.dots.instanceMatrix.needsUpdate=true;});}
  UI.tick(dt);
  if(!document.body.classList.contains('map')){ renderer.render(scene,camera); placeLabels(); }
  requestAnimationFrame(frame);
}
buildCurve();
{ const d=new Date(), nowMin=Math.round((d.getHours()*60+d.getMinutes())/5)*5; S.min = nowMin>sunrise+50&&nowMin<sunset-50 ? nowMin : Math.round((sunrise+sunset)/2/5)*5-20; }
setStage(['ops','build','cost'].includes(location.hash.slice(1))?location.hash.slice(1):'ops', false); resize(); refreshEnv();
addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(['ops','build','cost'].includes(h)&&h!==S.stage) setStage(h); });
{ const v = viewOf(S.stage); if(reduceMotion){camera.position.set(...v[0]); controls.target.set(...v[1]);}
  else tween = {t0:performance.now()+300, ms:2800, p0:camera.position.clone(), p1:new THREE.Vector3(...v[0]), a0:controls.target.clone(), a1:new THREE.Vector3(...v[1])}; }
requestAnimationFrame(frame); requestAnimationFrame(()=>$('#boot')?.classList.add('gone'));
window.__twin = {S, live:()=>live, select, setStage, setView, refresh, camera, controls, EPC, annual, UI};
